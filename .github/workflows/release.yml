name: Publicar instalador

# Al subir una etiqueta vX.Y.Z (igual que la "version" de launcher/package.json)
# se compila el instalador de Windows y se publica como Release. Los launchers
# ya instalados se actualizan solos desde ahí.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar que la dirección del backend está puesta
        shell: bash
        run: |
          if grep -q "CAMBIA-ESTO" launcher/main/constants.js; then
            echo "::error::Pon la dirección de tu backend en launcher/main/constants.js antes de publicar."
            exit 1
          fi
      - name: Compilar y publicar
        working-directory: launcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npx electron-builder --win --publish always
