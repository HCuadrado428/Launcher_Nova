name: Publicar instalador

# Compila el instalador de Windows y lo publica como Release vX.Y.Z, con la
# "version" de launcher/package.json. Se lanza solo al subir a main un cambio
# de esa versión (o a mano desde la pestaña Actions). Los launchers ya
# instalados se actualizan solos desde el Release.
on:
  push:
    branches: [main]
    paths:
      - launcher/package.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar que la dirección del backend está puesta
        shell: bash
        run: |
          if grep -q "CAMBIA-ESTO" launcher/main/constants.js; then
            echo "::error::Pon la dirección de tu backend en launcher/main/constants.js antes de publicar."
            exit 1
          fi
      # El Release se crea antes de compilar: si se deja a electron-builder,
      # intenta crearlo dos veces a la vez (una por archivo) y la segunda falla.
      - name: Crear el Release si no existe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="v$(node -p "require('./launcher/package.json').version")"
          gh release view "$version" >/dev/null 2>&1 \
            || gh release create "$version" --target "$GITHUB_SHA" --title "Nova Launcher $version" --notes "Descarga el archivo .exe para instalar el launcher." \
            || gh release view "$version" >/dev/null
      - name: Compilar y publicar
        working-directory: launcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npx electron-builder --win --publish always
