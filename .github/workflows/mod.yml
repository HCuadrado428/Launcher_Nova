name: Compilar mod

# Compila el mod del menú (carpeta mod/) y cuelga el .jar en el Release de la
# versión actual del launcher, junto al instalador. No tiene Release propio
# para que la actualización automática del launcher no se confunda.
on:
  push:
    branches: [main]
    paths:
      - mod/**
      - .github/workflows/mod.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compilar
        working-directory: mod
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: novamenu
          path: mod/build/libs/*.jar
          if-no-files-found: error
      - name: Subir el .jar al Release del launcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="v$(node -p "require('./launcher/package.json').version")"
          gh release view "$version" >/dev/null 2>&1 \
            || gh release create "$version" --target "$GITHUB_SHA" --title "Nova Launcher $version" --notes "Descarga el archivo .exe para instalar el launcher. Code signing policy: https://github.com/HCuadrado428/Launcher_Nova#code-signing-policy" \
            || gh release view "$version" >/dev/null
          gh release upload "$version" mod/build/libs/novamenu-*.jar --clobber
