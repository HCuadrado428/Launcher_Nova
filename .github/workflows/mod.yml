name: Compilar mod

# Compila el mod del menú (carpeta mod/) y deja el .jar como artefacto de la
# ejecución. No se publica como Release para no mezclarlo con los del launcher.
on:
  push:
    branches: [main]
    paths:
      - mod/**
      - .github/workflows/mod.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compilar
        working-directory: mod
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: novamenu
          path: mod/build/libs/*.jar
          if-no-files-found: error
