<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https://mc-heads.net https://cdn.modrinth.com nova-shot:; style-src 'self'; script-src 'self'"
    />
    <title>Nova Launcher</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <!-- Los textos se rellenan desde i18n.js según el idioma: data-i18n pone el
       texto y data-i18n-attr un atributo ("placeholder:clave"). -->
  <body data-view="boot">
    <div class="grain" aria-hidden="true"></div>

    <!-- ---------- Inicio de sesión ---------- -->
    <main class="login" id="loginView">
      <img class="login-logo" src="assets/logo.webp" alt="" width="132" height="132" />
      <h1 class="glitch">NOVA 2</h1>
      <p class="login-signal" data-i18n="login.signal"></p>

      <button class="btn btn-primary btn-big" id="msLoginBtn" type="button" data-i18n="login.microsoft"></button>

      <div class="divider"><span data-i18n="login.orOffline"></span></div>
      <form class="offline-form" id="offlineForm" autocomplete="off">
        <input id="offlineNick" maxlength="16" spellcheck="false" data-i18n-attr="placeholder:login.nick|aria-label:login.nick" />
        <button class="btn" type="submit" id="offlineLoginBtn" data-i18n="login.enter"></button>
      </form>
      <p class="login-error" id="loginError" role="alert" hidden></p>

      <button class="link-btn login-settings" type="button" data-open-settings data-i18n="common.settings"></button>
    </main>

    <!-- ---------- Principal ---------- -->
    <div class="main" id="mainView">
      <aside class="side">
        <div class="brand">
          <img src="assets/logo.webp" alt="" width="44" height="44" />
          <div>
            <strong>NOVA 2</strong>
            <span>LAUNCHER</span>
          </div>
        </div>

        <div class="account">
          <div class="avatar" id="avatar" aria-hidden="true"></div>
          <div class="account-text">
            <strong id="accountName"></strong>
            <span id="accountType"></span>
          </div>
          <span class="badge-admin" id="adminBadge" hidden>ADMIN</span>
        </div>

        <div class="server" id="serverBox" data-state="unknown">
          <span class="server-label" data-i18n="server.label"></span>
          <span class="server-state"><i class="dot" aria-hidden="true"></i><span id="serverText"></span></span>
          <button class="link-btn server-ip" id="copyIpBtn" type="button" data-i18n-attr="title:server.copyIp"></button>
        </div>

        <!-- Secciones del launcher. La que está abierta va en <section class="stage" data-page>. -->
        <nav class="pages-nav" id="pagesNav">
          <button class="nav-btn" type="button" data-page="home" data-i18n="nav.home"></button>
          <button class="nav-btn" type="button" data-page="mods" data-i18n="nav.mods"></button>
          <button class="nav-btn" type="button" data-page="shots" data-i18n="nav.shots"></button>
        </nav>

        <nav class="side-nav">
          <button class="side-btn" type="button" id="webBtn" data-i18n="side.web"></button>
          <button class="side-btn side-help" type="button" id="helpBtn" data-i18n="help.button"></button>
          <button class="side-btn" type="button" data-open-settings data-i18n="common.settings"></button>
          <button class="side-btn" type="button" id="logoutBtn" data-i18n="side.logout"></button>
        </nav>
        <p class="version" id="versionLabel"></p>
      </aside>

      <section class="stage" data-page="home">
        <div class="update-banner" id="updateBanner" hidden>
          <span id="updateText"></span>
          <button class="btn" type="button" id="updateBtn" data-i18n="update.button"></button>
        </div>

        <div class="tabs" id="packTabs" role="tablist"></div>

        <!-- Aviso a pantalla completa cuando no se pueden cargar los modpacks
             (sin conexión, acceso suspendido...). Tapa todas las secciones. -->
        <div class="stage-empty" id="stageEmpty" hidden>
          <p class="stage-empty-title" id="emptyTitle"></p>
          <p id="emptyText"></p>
          <button class="btn" type="button" id="retryBtn" data-i18n="common.retry"></button>
        </div>

        <!-- ===== Inicio ===== -->
        <div class="page page-home">
        <div class="stage-body">
          <div class="hero" id="hero">
            <span class="hero-tag" id="packTag"></span>
            <div class="hero-title">
              <h1 id="packTitle"></h1>
              <!-- Frase al azar de las que escribe el dueño en el panel; al pulsarla sale otra. -->
              <button class="splash" id="splash" type="button" hidden></button>
            </div>
            <p class="hero-desc" id="packDesc"></p>
            <p class="hero-playtime" id="playtime"></p>
            <p class="hero-state" id="packState"></p>
            <!-- Versiones, tamaño y fecha: al jugador no le hacen falta para jugar. -->
            <details class="pack-details">
              <summary data-i18n="pack.details"></summary>
              <ul class="chips" id="packChips"></ul>
            </details>
            <button class="link-btn import-link" type="button" data-open-import data-i18n="import.link"></button>
          </div>

          <aside class="info" id="infoBox" hidden>
            <div class="info-card info-event" id="eventCard" hidden>
              <span class="info-label" data-i18n="event.next"></span>
              <strong id="eventName"></strong>
              <span class="event-countdown" id="eventCountdown"></span>
              <span class="event-local" id="eventLocal"></span>
            </div>
            <div class="info-card" id="onlineCard" hidden>
              <span class="info-label" data-i18n="online.title"></span>
              <ul class="online-list" id="onlineList"></ul>
            </div>
            <div class="info-card" id="newsCard" hidden>
              <span class="info-label" data-i18n="news.title"></span>
              <p id="newsText"></p>
              <span class="news-date" id="newsDate"></span>
            </div>
          </aside>
        </div>

        <div class="launch" id="launchBox">
          <button class="btn btn-primary btn-play" id="playBtn" type="button"></button>
          <div class="progress" id="progressBox" hidden>
            <p class="progress-label"><span class="progress-step" id="progressStep"></span><span id="progressLabel"></span></p>
            <div class="progress-bar" id="progressBar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
              <span id="progressFill"></span>
            </div>
            <p class="progress-hint" id="progressHint" hidden data-i18n="play.firstTime"></p>
          </div>
        </div>

        <details class="console" id="consoleBox">
          <summary data-i18n="console.title"></summary>
          <pre id="consoleLog"></pre>
        </details>
        </div>

        <!-- ===== Mods ===== -->
        <div class="page page-mods">
          <h2 class="page-title"><span data-i18n="mods.title"></span> <small id="modsPack"></small></h2>
          <div class="mods-columns">
            <section>
              <h3 data-i18n="mods.optional"></h3>
              <p class="hint" data-i18n="mods.optionalHint"></p>
              <ul class="mods-list" id="optionalList"></ul>
              <p class="hint" id="optionalEmpty" hidden data-i18n="mods.optionalEmpty"></p>
            </section>
            <section>
              <h3 data-i18n="mods.own"></h3>
              <p class="hint" data-i18n="mods.ownHint"></p>
              <ul class="mods-list" id="ownList"></ul>
              <p class="hint" id="ownEmpty" hidden data-i18n="mods.ownEmpty"></p>
              <div class="row">
                <button class="btn" type="button" id="addModsBtn" data-i18n="mods.add"></button>
                <button class="btn" type="button" id="modsFolderBtn" data-i18n="settings.openFolder"></button>
              </div>
            </section>
          </div>
          <p class="settings-error" id="modsError" role="alert" hidden></p>

          <!-- Buscador de mods de cliente en Modrinth (main/modrinth.js). -->
          <section class="mod-search">
            <h3 data-i18n="mods.search.title"></h3>
            <p class="hint" data-i18n="mods.search.hint"></p>
            <form class="row" id="modSearchForm">
              <input id="modSearchInput" type="search" maxlength="80" spellcheck="false" data-i18n-attr="placeholder:mods.search.placeholder|aria-label:mods.search.placeholder" />
              <button class="btn" type="submit" data-i18n="mods.search.button"></button>
            </form>
            <p class="hint" id="modSearchStatus" role="status"></p>
            <ul class="search-results" id="modSearchResults"></ul>
          </section>
        </div>

        <!-- ===== Capturas ===== -->
        <div class="page page-shots">
          <div class="page-head">
            <h2 class="page-title"><span data-i18n="shots.title"></span> <small id="shotsCount"></small></h2>
            <div class="row">
              <button class="btn" type="button" id="shotsRefresh" data-i18n="shots.refresh"></button>
              <button class="btn" type="button" id="shotsFolder" data-i18n="settings.openFolder"></button>
            </div>
          </div>
          <p class="hint" data-i18n="shots.hint"></p>
          <ul class="shots-grid" id="shotsGrid"></ul>
          <p class="shots-empty" id="shotsEmpty" hidden data-i18n="shots.empty"></p>
        </div>
      </section>
    </div>

    <!-- ---------- Ajustes ---------- -->
    <dialog class="settings" id="settingsDialog" aria-labelledby="settingsTitle">
      <form method="dialog" id="settingsForm">
        <h2 id="settingsTitle" data-i18n="settings.title"></h2>

        <div class="field">
          <label for="memoryRange"><span data-i18n="settings.memory"></span> <output id="memoryOut"></output></label>
          <label class="check check-inline">
            <input type="checkbox" id="memoryAutoCheck" />
            <span data-i18n="settings.memoryAuto"></span>
          </label>
          <input id="memoryRange" type="range" min="2" step="1" />
          <p class="hint" data-i18n="settings.memoryHint"></p>
          <p class="hint hint-warn" id="memoryLow" hidden data-i18n="settings.memoryLow"></p>
        </div>

        <label class="check">
          <input type="checkbox" id="joinServerCheck" />
          <span data-i18n="settings.join"></span>
        </label>

        <div class="field-pair">
          <div class="field">
            <label for="javaPath" data-i18n="settings.java"></label>
            <div class="row">
              <input id="javaPath" spellcheck="false" data-i18n-attr="placeholder:settings.javaAuto" />
              <button class="btn" type="button" id="pickJavaBtn" data-i18n="settings.pick"></button>
            </div>
          </div>
          <div class="field">
            <label for="languageSelect" data-i18n="settings.language"></label>
            <select id="languageSelect"></select>
          </div>
        </div>

        <div class="field-pair field-pair-even">
          <div class="field">
            <label for="textSizeSelect" data-i18n="settings.textSize"></label>
            <select id="textSizeSelect">
              <option value="1" data-i18n="settings.textSize.1"></option>
              <option value="2" data-i18n="settings.textSize.2"></option>
              <option value="3" data-i18n="settings.textSize.3"></option>
            </select>
          </div>
          <div class="field">
            <label for="themeSelect" data-i18n="settings.theme"></label>
            <select id="themeSelect">
              <option value="emerald" data-i18n="theme.emerald"></option>
              <option value="end" data-i18n="theme.end"></option>
              <option value="nether" data-i18n="theme.nether"></option>
              <option value="ocean" data-i18n="theme.ocean"></option>
              <option value="gold" data-i18n="theme.gold"></option>
            </select>
          </div>
        </div>

        <label class="check">
          <input type="checkbox" id="calmCheck" />
          <span data-i18n="settings.calm"></span>
        </label>

        <div class="field" id="packActions">
          <span class="field-title" data-i18n="settings.pack"></span>
          <div class="row">
            <button class="btn" type="button" id="openFolderBtn" data-i18n="settings.openFolder"></button>
            <button class="btn" type="button" id="repairBtn" data-i18n="settings.repair"></button>
            <button class="btn" type="button" id="logsBtn" data-i18n="settings.logs"></button>
            <button class="btn" type="button" id="settingsImportBtn" data-i18n="settings.import"></button>
          </div>
        </div>

        <details class="advanced">
          <summary data-i18n="settings.advanced"></summary>
          <div class="field">
            <label for="backendUrl" data-i18n="settings.backend"></label>
            <input id="backendUrl" placeholder="https://..." spellcheck="false" />
          </div>
        </details>

        <p class="settings-error" id="settingsError" role="alert" hidden></p>
        <div class="dialog-actions">
          <button class="btn" type="button" id="settingsCancel" data-i18n="common.cancel"></button>
          <button class="btn btn-primary" type="submit" data-i18n="common.save"></button>
        </div>
      </form>
    </dialog>

    <!-- ---------- Traer cosas de otro launcher ---------- -->
    <dialog class="settings import-dialog" id="importDialog" aria-labelledby="importTitle">
      <h2 id="importTitle" data-i18n="import.title"></h2>
      <p class="hint import-intro"><span data-i18n="import.hint"></span> <strong id="importTarget"></strong></p>

      <div class="field">
        <span class="field-title" data-i18n="import.from"></span>
        <ul class="import-list" id="importSources"></ul>
        <p class="hint" id="importNone" hidden data-i18n="import.none"></p>
        <div class="row">
          <button class="btn" type="button" id="importPick" data-i18n="import.pick"></button>
        </div>
      </div>

      <div class="field" id="importWhatBox" hidden>
        <span class="field-title" data-i18n="import.what"></span>
        <ul class="import-list" id="importCats"></ul>
        <p class="hint" id="importWorldsNote" hidden data-i18n="import.worldsNote"></p>
      </div>

      <p class="settings-error" id="importError" role="alert" hidden></p>
      <p class="import-result" id="importResult" role="status" hidden></p>
      <div class="dialog-actions">
        <button class="btn" type="button" id="importClose" data-i18n="common.close"></button>
        <button class="btn btn-primary" type="button" id="importRun" disabled data-i18n="import.run"></button>
      </div>
    </dialog>

    <!-- ---------- Ayuda ---------- -->
    <dialog class="settings help-dialog" id="helpDialog" aria-labelledby="helpTitle">
      <h2 id="helpTitle" data-i18n="help.title"></h2>
      <p data-i18n="help.try"></p>
      <p data-i18n="help.text"></p>
      <p class="settings-error" id="helpError" role="alert" hidden></p>
      <div class="dialog-actions">
        <button class="btn" type="button" id="helpClose" data-i18n="common.close"></button>
        <button class="btn" type="button" id="helpDiscord" hidden data-i18n="help.discord"></button>
        <button class="btn btn-primary" type="button" id="helpSave" data-i18n="crash.save"></button>
      </div>
    </dialog>

    <!-- ---------- Cierre por error ---------- -->
    <dialog class="settings crash-dialog" id="crashDialog" aria-labelledby="crashTitle">
      <h2 id="crashTitle" data-i18n="crash.title"></h2>
      <p class="hint" id="crashCode"></p>

      <div class="crash-block" id="crashWhatBox">
        <h3 data-i18n="crash.what"></h3>
        <p id="crashWhat"></p>
        <p class="crash-exception" id="crashException"></p>
      </div>
      <div class="crash-block" id="crashSuspectsBox" hidden>
        <h3 data-i18n="crash.suspects"></h3>
        <ul id="crashSuspects"></ul>
      </div>
      <p id="crashOom" hidden data-i18n="crash.oom"></p>
      <p class="hint" data-i18n="crash.help"></p>

      <p class="settings-error" id="crashError" role="alert" hidden></p>
      <div class="dialog-actions">
        <button class="btn" type="button" id="crashClose" data-i18n="common.close"></button>
        <button class="btn" type="button" id="crashDiscord" hidden data-i18n="help.discord"></button>
        <button class="btn btn-primary" type="button" id="crashSave" data-i18n="crash.save"></button>
      </div>
    </dialog>

    <div class="toasts" id="toasts" popover="manual" role="status" aria-live="polite"></div>
    <script src="i18n.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
